[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-operations-platform"
version = "0.2.0"
description = "Clean-room demonstration of restart-safe data operations patterns"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "James Marshall"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
